name: Deploy Static HTML to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Clean Static Site
        run: |
          mkdir -p _site
          cp -f index.html _site/
          cp -f styles.css _site/
          cp -f script.js _site/
          cp -f favicon.ico _site/ 2>/dev/null || true
          cp -f icon.png _site/ 2>/dev/null || true
          cp -f apple-icon.png _site/ 2>/dev/null || true
          cp -r assets _site/
          # Disable Jekyll processing on GitHub Pages
          touch _site/.nojekyll

      - name: Upload Static HTML Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
